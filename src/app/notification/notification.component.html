@if (notificationService.notifications().length > 0) {
  <div class="notification-container" role="region" aria-label="Powiadomienia">
    @for (notif of notificationService.notifications(); track notif.id) {
      <div
        class="notification-item"
        [class]="'notification-' + notif.type"
        role="alert"
        aria-live="assertive"
      >
        <div class="notification-content">
          <span class="notification-message">{{ notif.message }}</span>
        </div>

        <div class="notification-actions">
          @if (notif.action) {
            <button
              type="button"
              class="btn-notification-action"
              (click)="handleAction(notif)"
            >
              {{ notif.action.label }}
            </button>
          }
          <button
            type="button"
            class="btn-notification-close"
            (click)="dismiss(notif.id)"
            aria-label="Zamknij powiadomienie"
          >
            ✕
          </button>
        </div>
      </div>
    }
  </div>
}
